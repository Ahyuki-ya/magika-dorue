:root {
            /* 基調 */
            --c-bg: #000018;         --c-bg-game: #000010;   --c-panel: rgba(0,8,32,0.92);
            --c-frame: #4466cc;      --c-frame-dim: #2244aa; --c-frame-faint: #1a2a60;
            --c-text: #f0f0f0;       --c-text-sub: #8899cc;  --c-text-faint: #6688aa;
            --c-gold: #ffcc00;       --c-dia: #00ffee;       --c-danger: #ff4422;
            --c-ok: #2ecc71;         --c-traded: #ff9977;
            /* ボタン地色（枠色と対の暗色） */
            --c-btn-ok-bg: #1a3a2a;  --c-btn-gold-bg: #3a3210; --c-btn-warn-bg: #3a1a1a;
            --c-btn-warn: #aa4433;   --c-input-bg: #050a20;    --c-input-text: #cfe3ff;
            /* レア度（宝具システムの RARITIES と同値・二重管理注意） */
            --r-common: #95a5a6; --r-uncommon: #2ecc71; --r-rare: #3498db;
            --r-epic: #9b59b6;   --r-legendary: #ffcc00; --r-god: #ff44dd;
            /* 書体（D-4/(2)：和文と欧文で同じ書体系列。ここ以外で font-family を書かない） */
            --font-ui: 'PixelMplus12', monospace;
            /* ===== アイコンの絵の具（D-4/(1)：ドット絵SVG が参照する） =====
               1アイコン3〜4色＋輪郭。明部と暗部の2階調で立体を出し、影・光沢は使わない。
               既存の色トークンと同じ役割のものは var() で借りて二重管理を避ける。 */
            --i-ink: #0b0b16;
            --i-white: var(--c-text);   --i-white-d: #b4bac8;
            --i-steel: #ccd6ea;         --i-steel-d: #7d8cb0;
            --i-gold: var(--c-gold);    --i-gold-d: #c89400;
            --i-red: #e0483c;           --i-red-d: #99241c;
            --i-cyan: var(--c-dia);     --i-cyan-d: #00b3aa;
            --i-stone: #a3adc2;         --i-stone-d: #6c768c;
            --i-wood: #a06a34;          --i-wood-d: #6b4420;
            --i-violet: #b46be0;        --i-violet-d: #7a3aa8;
            /* 形・動き */
            --radius: 2px;           --dur-fast: 90ms;       --dur-mid: 150ms;
            /* 間隔（4px 刻み・半段の 2px 刻みまで）。余白はこの中から選ぶこと。
               既存コードは実質この目盛りに乗っている（6/10/14/18 は半段）。
               新しく書くときに 7px や 13px のような目盛り外の値を持ち込まない。 */
            --s-1: 4px;   --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
            --s-5: 20px;  --s-6: 24px;  --s-8: 32px;  --s-10: 40px;
            --s-h2: 6px;  --s-h3: 10px; --s-h4: 14px; --s-h5: 18px;
        }
body{background:var(--c-bg);color:var(--c-text);font-family:var(--font-ui);margin:0;padding:24px}
h1{font-size:24px;margin:0 0 24px}
h2{font-size:12px;color:var(--c-text-sub);margin:32px 0 12px;letter-spacing:2px}
.sheet{display:flex;flex-wrap:wrap;gap:24px}
figure{margin:0;text-align:center}
.big{width:256px;height:256px;image-rendering:pixelated;background:var(--c-bg-game);
     border:1px solid var(--c-frame-faint)}
figcaption{font-size:12px;margin-top:8px;color:var(--c-text-sub)}
.ico{width:16px;height:16px;vertical-align:-3px;margin-right:8px}
.row{display:block;font-size:12px;margin:8px 0}
.onlight{background:var(--c-text);padding:8px;display:inline-block}
</style></head><body>
