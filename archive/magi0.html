<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2Dドット絵ダンジョン迎撃ゲーム</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #dashboard {
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
        button:hover { background-color: #2980b9; }
        canvas {
            background-color: #ecf0f1;
            border: 4px solid #555;
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .legend {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            font-size: 14px;
        }
        .color-box {
            display: inline-block;
            width: 15px; height: 15px;
            vertical-align: middle; margin-right: 5px;
        }
    </style>
</head>
<body>

    <div id="dashboard">
        <h2>地下ダンジョン防衛線</h2>
        <button onclick="spawnHero()">⚔️ 勇者をテスト召喚</button>
        <div class="legend">
            <span><div class="color-box" style="background:#3498db;"></div>勇者</span>
            <span><div class="color-box" style="background:#2c3e50;"></div>石スライム</span>
            <span><div class="color-box" style="background:#2ecc71;"></div>苔ゴブリン</span>
            <span><div class="color-box" style="background:#95a5a6;"></div>普通の石</span>
            <span><div class="color-box" style="background:#7f8c8d;"></div>苔むした石</span>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // グリッド設定
    const COLS = 20;
    const ROWS = 20;
    const TILE_SIZE = 30; // 1マスのピクセルサイズ
    canvas.width = COLS * TILE_SIZE;
    canvas.height = ROWS * TILE_SIZE;

    // ゲームデータ
    let map = []; // 0: 空間, 1: 石, 2: 苔石
    let heroes = [];
    let monsters = [];
    let isDragging = false;

    // マップ初期化 (一番上は空間、残りは8割石、2割苔石)
    for (let y = 0; y < ROWS; y++) {
        map[y] = [];
        for (let x = 0; x < COLS; x++) {
            if (y === 0) {
                map[y][x] = 0;
            } else {
                map[y][x] = Math.random() < 0.2 ? 2 : 1;
            }
        }
    }

    // 操作イベント（指でなぞる操作の再現）
    canvas.addEventListener('mousedown', (e) => { isDragging = true; dig(e); });
    canvas.addEventListener('mousemove', (e) => { if (isDragging) dig(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // 掘削＆召喚処理
    function dig(e) {
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / TILE_SIZE);
        const y = Math.floor((e.clientY - rect.top) / TILE_SIZE);

        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

        if (map[y][x] === 1) {
            // 普通の石を壊す -> 石スライム
            map[y][x] = 0;
            monsters.push({ x: x, y: y, hp: 3, maxHp: 3, atk: 1, agi: 1, cd: 0, color: '#2c3e50' });
        } else if (map[y][x] === 2) {
            // 苔むした石を壊す -> 苔ゴブリン
            map[y][x] = 0;
            monsters.push({ x: x, y: y, hp: 2, maxHp: 2, atk: 1, agi: 2, cd: 0, color: '#2ecc71' });
        }
    }

    // 勇者召喚
    function spawnHero() {
        const startX = Math.floor(Math.random() * COLS);
        heroes.push({ x: startX, y: 0, hp: 5, maxHp: 5, atk: 5, agi: 5, cd: 0, color: '#3498db' });
    }

    // 1分(60000ms)に1回、自動で勇者が攻めてくる
    setInterval(spawnHero, 60000);

    // ロジック更新 (行動ゲージが60に達したら行動)
    const ACTION_THRESHOLD = 60;

    function updateEntity(entity, enemies, isHero) {
        entity.cd += entity.agi;
        if (entity.cd >= ACTION_THRESHOLD) {
            entity.cd -= ACTION_THRESHOLD;

            let target = null;
            let minDist = Infinity;

            // 最も近い敵を探す（マンハッタン距離）
            enemies.forEach(enemy => {
                const dist = Math.abs(enemy.x - entity.x) + Math.abs(enemy.y - entity.y);
                if (dist < minDist) {
                    minDist = dist;
                    target = enemy;
                }
            });

            if (target) {
                if (minDist <= 1) {
                    // 隣接（または同じマス）なら攻撃
                    target.hp -= entity.atk;
                } else {
                    // 敵に向かって1マス移動
                    const dx = target.x - entity.x;
                    const dy = target.y - entity.y;
                    
                    if (Math.abs(dx) > Math.abs(dy)) {
                        entity.x += (dx > 0 ? 1 : -1);
                    } else {
                        entity.y += (dy > 0 ? 1 : -1);
                    }
                }
            } else if (isHero) {
                // 敵がいない場合、勇者は下に直進
                if (entity.y < ROWS - 1) entity.y++;
            }
        }
    }

    // メインゲームループ
    function gameLoop() {
        // ロジック更新
        heroes.forEach(h => updateEntity(h, monsters, true));
        monsters.forEach(m => updateEntity(m, heroes, false));

        // 死亡判定 (耐久力が0以下のものを配列から除外)
        heroes = heroes.filter(h => h.hp > 0);
        monsters = monsters.filter(m => m.hp > 0);

        // 描画処理
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // マップ描画
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (map[y][x] === 1) {
                    ctx.fillStyle = '#95a5a6'; // 普通の石
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#7f8c8d';
                    ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (map[y][x] === 2) {
                    ctx.fillStyle = '#7f8c8d'; // 苔むした石
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#555';
                    ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // エンティティとHPバーの描画関数
        function drawEntity(entity) {
            // 本体
            ctx.fillStyle = entity.color;
            ctx.fillRect(entity.x * TILE_SIZE + 2, entity.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
            
            // HPバー (背景)
            ctx.fillStyle = 'red';
            ctx.fillRect(entity.x * TILE_SIZE, entity.y * TILE_SIZE - 4, TILE_SIZE, 4);
            // HPバー (残りHP)
            ctx.fillStyle = '#2ecc71';
            const hpRatio = Math.max(0, entity.hp) / entity.maxHp;
            ctx.fillRect(entity.x * TILE_SIZE, entity.y * TILE_SIZE - 4, TILE_SIZE * hpRatio, 4);
        }

        monsters.forEach(drawEntity);
        heroes.forEach(drawEntity);

        requestAnimationFrame(gameLoop);
    }

    // ゲーム開始
    gameLoop();
</script>
</body>
</html>
