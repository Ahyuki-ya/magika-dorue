<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Magi Dorue</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        #startScreen { display: flex; background-color: #111; }
        #gameScreen {
            justify-content: flex-start;
            padding-top: 15px;
            background-color: #222;
            position: relative;
            height: 100%;
            box-sizing: border-box;
        }
        
        .title { font-size: 4rem; margin-bottom: 30px; color: #f1c40f; text-shadow: 2px 2px #8e44ad, 4px 4px #2c3e50; letter-spacing: 5px; }
        .gameover-title { font-size: 4rem; color: #e74c3c; margin-bottom: 20px; }

        #dashboard { margin-bottom: 10px; text-align: center; z-index: 10; flex-shrink: 0; }
        .btn-group { margin-bottom: 8px; }
        button {
            padding: 8px 16px; font-size: 14px; cursor: pointer;
            color: white; border: none; border-radius: 5px; font-weight: bold;
            margin: 0 4px; transition: 0.2s;
        }
        .btn-start { background-color: #e67e22; font-size: 1.5rem; padding: 15px 40px; border: 2px solid #d35400; }
        .btn-start:hover { background-color: #d35400; }
        .btn-hero { background-color: #3498db; }
        .btn-hero:hover { background-color: #2980b9; }
        .btn-castle { background-color: #8e44ad; }
        .btn-castle:hover { background-color: #732d91; }
        .btn-castle.active { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }
        .btn-reset { background-color: #e67e22; border: 2px solid #d35400; padding: 10px 20px; font-size: 16px; }
        .btn-reset:hover { background-color: #d35400; }
        
        #canvasContainer {
            width: 600px; height: 600px; 
            overflow-y: auto; overflow-x: hidden;
            border: 4px solid #555; box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative; background-color: #ecf0f1;
        }
        #canvasContainer::-webkit-scrollbar { width: 12px; }
        #canvasContainer::-webkit-scrollbar-track { background: #222; }
        #canvasContainer::-webkit-scrollbar-thumb { background: #555; border-radius: 6px; }
        #canvasContainer::-webkit-scrollbar-thumb:hover { background: #777; }

        canvas { display: block; cursor: crosshair; }

        .legend {
            margin-top: 5px; display: flex; gap: 10px; font-size: 12px;
            justify-content: center; flex-wrap: wrap; max-width: 700px;
        }
        .color-box {
            display: inline-block; width: 12px; height: 12px;
            vertical-align: middle; margin-right: 3px; border-radius: 2px;
        }
        .dot-box { border-radius: 50%; }
        #message { height: 20px; color: #e74c3c; font-weight: bold; margin-bottom: 5px; }

        /* HUDデザイン */
        #goldUI {
            position: absolute; top: 15px; right: 20px;
            font-size: 20px; font-weight: bold; color: #f1c40f;
            background: rgba(0, 0, 0, 0.7); padding: 8px 15px;
            border-radius: 5px; border: 2px solid #f39c12; z-index: 100;
        }
        #heroStatsUI {
            position: absolute; top: 15px; left: 20px;
            font-size: 14px; font-weight: bold; color: #ecf0f1;
            background: rgba(0, 0, 0, 0.7); padding: 8px 15px;
            border-radius: 5px; border: 2px solid #3498db; z-index: 100;
            text-align: left;
        }
        .stat-highlight { color: #e74c3c; font-size: 16px; }
    </style>
</head>
<body>

    <div id="startScreen" class="screen">
        <h1 class="title">Magi Dorue</h1>
        <button class="btn-start" onclick="enterGameScreen()">ゲーム開始</button>
    </div>

    <div id="gameScreen" class="screen">
        <div id="heroStatsUI">
            【次期 勇者スペック】<br>
            攻: <span id="hAtk" class="stat-highlight">1</span> / 
            敏: <span id="hAgi" class="stat-highlight">2</span> / 
            HP: <span id="hHp" class="stat-highlight">5</span><br>
            <span style="font-size: 10px; color: #aaa;">(索敵範囲: 20)</span>
        </div>
        <div id="goldUI">Gold: <span id="goldAmount">50</span></div>
        
        <div id="dashboard">
            <div class="btn-group">
                <button class="btn-reset" onclick="resetAndStartGame()">▶️ 新規ゲームスタート (地形リセット)</button>
            </div>
            <div class="btn-group">
                <button class="btn-hero" onclick="spawnHero(true)">⚔️ 勇者をテスト召喚</button>
                <button class="btn-castle" id="castleBtn" onclick="toggleCastleMode()">🏰 魔王の家を配置</button>
            </div>
            <div id="message"></div>
            <div class="legend">
                <span><div class="color-box dot-box" style="background:#3498db;"></div>勇者</span>
                <span><div class="color-box dot-box" style="background:#2c3e50;"></div>スライム(攻1/敏1/HP3)</span>
                <span><div class="color-box dot-box" style="background:#2ecc71;"></div>ゴブリン(攻1/敏2/HP2)</span>
                <span><div class="color-box dot-box" style="background:#d35400;"></div>銅ゴーレム(攻2/敏1/HP4)</span><br>
                <span><div class="color-box" style="background:#8e44ad;"></div>魔王の家(HP10)</span>
                <span><div class="color-box" style="background:#95a5a6;"></div>石(75%)</span>
                <span><div class="color-box" style="background:#7b8d41;"></div>苔石(20%)</span>
                <span><div class="color-box" style="background:#9A6229;"></div>銅(5%)</span>
            </div>
        </div>
        
        <div id="canvasContainer">
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <div id="gameOverScreen" class="screen">
        <h1 class="gameover-title">GAME OVER</h1>
        <p style="font-size: 1.5rem; margin-bottom: 30px;">魔王の家が勇者に破壊された...</p>
        <button class="btn-start" onclick="location.reload()">タイトルへ戻る</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const msgDiv = document.getElementById('message');
    const castleBtn = document.getElementById('castleBtn');
    const goldSpan = document.getElementById('goldAmount');
    
    // 勇者のステータス用UI
    const hAtkSpan = document.getElementById('hAtk');
    const hAgiSpan = document.getElementById('hAgi');
    const hHpSpan = document.getElementById('hHp');
    
    const COLS = 20;
    const ROWS = 40; 
    const TILE_SIZE = 30;
    canvas.width = COLS * TILE_SIZE;
    canvas.height = ROWS * TILE_SIZE;

    // ゲーム内変数
    let map = []; 
    let heroes = [];
    let monsters = [];
    let particles = []; 
    let isDragging = false;
    let isPlacingCastle = false;
    let castlePos = null;
    let castleHp = 10;
    const CASTLE_MAX_HP = 10;
    let isGameRunning = false;
    let gold = 50; 
    
    // 勇者のスケーリング用変数
    let heroBaseAtk = 1;
    let heroBaseAgi = 2;
    let heroBaseHp = 5;
    const HERO_SEARCH_RANGE = 20;
    let isWaveStarted = false;
    let heroTimerId = null;

    const ENTRANCE_X = Math.floor(COLS / 2);
    const SKY_LAYERS = 2; 

    // マップ生成関数（生成比率 石:75%, 苔石:20%, 銅:5%）
    function generateMap() {
        map = [];
        for (let y = 0; y < ROWS; y++) {
            map[y] = [];
            for (let x = 0; x < COLS; x++) {
                if (y < SKY_LAYERS) { map[y][x] = 4; } // 空
                else if (y === SKY_LAYERS) { map[y][x] = (x === ENTRANCE_X) ? 0 : 3; } // 土
                else if (y === SKY_LAYERS + 1 && x === ENTRANCE_X) { map[y][x] = 0; } // 入り口直下
                else { map[y][x] = 1; } // デフォルトはすべて石(1)
            }
        }

        const undergroundRows = ROWS - SKY_LAYERS - 1;
        const totalUndergroundTiles = (undergroundRows * COLS) - 1; 

        // 苔石: 20%
        const targetMossyCount = Math.floor(totalUndergroundTiles * 0.20);
        let currentMossyCount = 0;
        while (currentMossyCount < targetMossyCount) {
            let cx = Math.floor(Math.random() * COLS);
            let cy = Math.floor(Math.random() * undergroundRows) + SKY_LAYERS + 1;
            let clusterSize = Math.floor(Math.random() * 6) + 4;
            for (let i = 0; i < clusterSize && currentMossyCount < targetMossyCount; i++) {
                if (cx >= 0 && cx < COLS && cy > SKY_LAYERS && cy < ROWS) {
                    if (!(cy === SKY_LAYERS + 1 && cx === ENTRANCE_X) && map[cy][cx] === 1) {
                        map[cy][cx] = 2; 
                        currentMossyCount++;
                    }
                }
                const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                cx += dir[0]; cy += dir[1];
            }
        }

        // 銅ブロック: 5% (ランダム配置)
        const targetCopperCount = Math.floor(totalUndergroundTiles * 0.05);
        let currentCopperCount = 0;
        while (currentCopperCount < targetCopperCount) {
            let cx = Math.floor(Math.random() * COLS);
            let cy = Math.floor(Math.random() * undergroundRows) + SKY_LAYERS + 1;
            if (cy > SKY_LAYERS && cy < ROWS && map[cy][cx] === 1) {
                map[cy][cx] = 6; 
                currentCopperCount++;
            }
        }
    }

    // UI更新系
    function updateGoldUI() { goldSpan.innerText = gold; }
    function updateHeroStatsUI() {
        hAtkSpan.innerText = heroBaseAtk;
        hAgiSpan.innerText = heroBaseAgi;
        hHpSpan.innerText = heroBaseHp;
    }

    // リセット＆ゲーム開始処理
    function resetAndStartGame() {
        if (heroTimerId) clearInterval(heroTimerId);
        
        generateMap();
        heroes = []; monsters = []; particles = [];
        castlePos = null;
        castleHp = CASTLE_MAX_HP;
        gold = 50;
        isPlacingCastle = false;
        castleBtn.classList.remove('active');
        isWaveStarted = false; // ウェーブ停止（魔王の家配置待ち）
        
        // 勇者ステータスリセット
        heroBaseAtk = 1; heroBaseAgi = 2; heroBaseHp = 5;
        
        updateGoldUI();
        updateHeroStatsUI();
        
        msgDiv.innerText = "マップを生成しました。魔王の家を配置して防衛を開始してください！";
        setTimeout(() => { if(msgDiv.innerText.includes("生成")) msgDiv.innerText = ""; }, 3000);
    }

    function enterGameScreen() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        isGameRunning = true;
        resetAndStartGame();
        gameLoop();
    }

    function triggerGameOver() {
        isGameRunning = false;
        if (heroTimerId) clearInterval(heroTimerId);
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'flex';
    }

    function toggleCastleMode() {
        isPlacingCastle = !isPlacingCastle;
        castleBtn.classList.toggle('active', isPlacingCastle);
        msgDiv.innerText = isPlacingCastle ? "配置したい空間をクリックしてください" : "";
    }

    function isReachable(startX, startY, targetX, targetY) {
        if (startX === targetX && startY === targetY) return true;
        let queue = [{x: startX, y: startY}];
        let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
        visited[startY][startX] = true;
        const dirs = [{x:1, y:0}, {x:-1, y:0}, {x:0, y:1}, {x:0, y:-1}];
        
        while(queue.length > 0) {
            let curr = queue.shift();
            for (let d of dirs) {
                let nx = curr.x + d.x; let ny = curr.y + d.y;
                if (nx === targetX && ny === targetY) return true;
                if (nx >= 0 && nx < COLS && ny >= SKY_LAYERS && ny < ROWS && !visited[ny][nx]) {
                    if (map[ny][nx] === 0 || map[ny][nx] === 5) {
                        visited[ny][nx] = true; queue.push({x: nx, y: ny});
                    }
                }
            }
        }
        return false;
    }

    // エフェクト生成
    function spawnDebris(x, y, type) {
        let color = '#95a5a6'; 
        if (type === 2) color = '#7b8d41'; 
        if (type === 6) color = '#9A6229'; 

        const numParticles = 6 + Math.floor(Math.random() * 4); 
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: x * TILE_SIZE + TILE_SIZE / 2, y: y * TILE_SIZE + TILE_SIZE / 2,
                vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 1.2) * 6, 
                life: 1.0, color: color, size: Math.random() * 3 + 2
            });
        }
    }

    canvas.addEventListener('mousedown', (e) => { 
        if (isPlacingCastle) { placeCastle(e); } 
        else { isDragging = true; dig(e); }
    });
    canvas.addEventListener('mousemove', (e) => { if (isDragging && !isPlacingCastle) dig(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });

    function getJitter() { return (Math.random() - 0.5) * 12; }

    function placeCastle(e) {
        const x = Math.floor(e.offsetX / TILE_SIZE);
        const y = Math.floor(e.offsetY / TILE_SIZE);

        if (x < 0 || x >= COLS || y < SKY_LAYERS || y >= ROWS) return; 

        if (map[y][x] === 0) {
            if (isReachable(ENTRANCE_X, SKY_LAYERS, x, y)) {
                if (castlePos) map[castlePos.y][castlePos.x] = 0;
                map[y][x] = 5;
                castlePos = {x: x, y: y};
                castleHp = CASTLE_MAX_HP;
                toggleCastleMode();
                
                // 魔王の家が初めて配置されたら、勇者の襲撃（ウェーブ）を開始
                if (!isWaveStarted) {
                    isWaveStarted = true;
                    spawnHero(); // 直ちに1体目をスポーン
                    heroTimerId = setInterval(() => spawnHero(), 60000); // 以降1分間隔
                    msgDiv.innerText = "魔王の家を配置しました！勇者の襲撃が始まります！";
                } else {
                    msgDiv.innerText = "魔王の家を移動しました！";
                }
                setTimeout(() => { if(msgDiv.innerText.includes("魔王の家")) msgDiv.innerText = ""; }, 3000);
            } else {
                msgDiv.innerText = "そこは入り口から繋がっていないため配置できません！";
            }
        }
    }

    function dig(e) {
        if(!isGameRunning) return;
        const x = Math.floor(e.offsetX / TILE_SIZE);
        const y = Math.floor(e.offsetY / TILE_SIZE);

        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

        if (map[y][x] === 1 || map[y][x] === 2 || map[y][x] === 6) {
            if (gold >= 1) {
                gold -= 1; updateGoldUI();
                const type = map[y][x];
                spawnDebris(x, y, type); 
                map[y][x] = 0; 

                if (type === 1) {
                    monsters.push({ x: x, y: y, ox: getJitter(), oy: getJitter(), hp: 3, maxHp: 3, atk: 1, agi: 1, range: 4, cd: 0, isHero: false, color: '#2c3e50' });
                } else if (type === 2) {
                    monsters.push({ x: x, y: y, ox: getJitter(), oy: getJitter(), hp: 2, maxHp: 2, atk: 1, agi: 2, range: 10, cd: 0, isHero: false, color: '#2ecc71' });
                } else if (type === 6) {
                    monsters.push({ x: x, y: y, ox: getJitter(), oy: getJitter(), hp: 4, maxHp: 4, atk: 2, agi: 1, range: 6, cd: 0, isHero: false, color: '#d35400' });
                }
            } else {
                if(!isDragging) {
                    msgDiv.innerText = "ゴールドが足りません！";
                    setTimeout(() => { if(msgDiv.innerText.includes("ゴールド")) msgDiv.innerText = ""; }, 1000);
                }
            }
        }
    }

    // 勇者スポーン＆パラメータ上昇処理
    function spawnHero(isManual = false) {
        if(!isGameRunning) return;
        if(!isManual && !isWaveStarted) return; // 自動スポーンはウェーブ開始後のみ

        // 現在のスペックで生成
        heroes.push({ 
            x: 0, y: 1, ox: getJitter(), oy: getJitter(), 
            hp: heroBaseHp, maxHp: heroBaseHp, 
            atk: heroBaseAtk, agi: heroBaseAgi, 
            range: HERO_SEARCH_RANGE, cd: 0, isHero: true, color: '#3498db' 
        });

        // 生成後に次期スペックをランダム上昇（Atk, Agi, Hp のいずれか）
        const r = Math.floor(Math.random() * 3);
        if (r === 0) heroBaseAtk++;
        else if (r === 1) heroBaseAgi++;
        else heroBaseHp++;

        updateHeroStatsUI();
    }

    const ACTION_THRESHOLD = 60;
    function isPassable(x, y) {
        return (x >= 0 && x < COLS && y >= 0 && y < ROWS && (map[y][x] === 0 || map[y][x] === 4 || map[y][x] === 5));
    }

    function getNextStepTowardsCastle(entity) {
        if (!castlePos || (entity.x === castlePos.x && entity.y === castlePos.y)) return null;

        let queue = [{x: entity.x, y: entity.y, path: []}];
        let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
        visited[entity.y][entity.x] = true;
        const dirs = [{x:1, y:0}, {x:-1, y:0}, {x:0, y:1}, {x:0, y:-1}];

        while(queue.length > 0) {
            let curr = queue.shift();
            for (let d of dirs) {
                let nx = curr.x + d.x; let ny = curr.y + d.y;
                if (nx === castlePos.x && ny === castlePos.y) {
                    return curr.path.length > 0 ? curr.path[0] : {x: nx, y: ny};
                }
                if (isPassable(nx, ny) && !visited[ny][nx]) {
                    visited[ny][nx] = true;
                    queue.push({x: nx, y: ny, path: [...curr.path, {x: nx, y: ny}]});
                }
            }
        }
        return null;
    }

    function updateEntity(entity, enemies) {
        entity.cd += entity.agi;
        if (entity.cd >= ACTION_THRESHOLD) {
            entity.cd -= ACTION_THRESHOLD;

            if (entity.isHero && castlePos) {
                const distToCastle = Math.abs(castlePos.x - entity.x) + Math.abs(castlePos.y - entity.y);
                if (distToCastle <= 1) {
                    castleHp -= entity.atk;
                    if (castleHp <= 0) triggerGameOver();
                    return; 
                }
            }

            let target = null;
            let minDist = Infinity;

            enemies.forEach(enemy => {
                if (enemy.hp <= 0) return;
                if (!entity.isHero && enemy.y < SKY_LAYERS) return; // 空の勇者は見えない
                
                const dist = Math.abs(enemy.x - entity.x) + Math.abs(enemy.y - entity.y);
                
                // 索敵範囲外なら無視 (勇者も範囲制限を適用)
                if (dist > entity.range) return;

                if (dist < minDist) {
                    minDist = dist; target = enemy;
                }
            });

            if (target && minDist <= 1) {
                target.hp -= entity.atk;
                if (target.hp <= 0 && target.isHero) {
                    gold += 25; updateGoldUI();
                }
                return; 
            }

            if (entity.isHero) {
                if (entity.y < SKY_LAYERS) {
                    if (entity.x < ENTRANCE_X) entity.x++;
                    else if (entity.x === ENTRANCE_X) entity.y++;
                } else {
                    let nextStep = getNextStepTowardsCastle(entity);
                    if (nextStep) {
                        entity.x = nextStep.x; entity.y = nextStep.y;
                    } else if (target) {
                        const dx = Math.sign(target.x - entity.x); const dy = Math.sign(target.y - entity.y);
                        if (dx !== 0 && isPassable(entity.x + dx, entity.y)) entity.x += dx;
                        else if (dy !== 0 && isPassable(entity.x, entity.y + dy)) entity.y += dy;
                    } else {
                        if (isPassable(entity.x, entity.y + 1)) entity.y++;
                    }
                }
            } else {
                if (target) {
                    const dx = Math.sign(target.x - entity.x); const dy = Math.sign(target.y - entity.y);
                    if (dx !== 0 && isPassable(entity.x + dx, entity.y)) entity.x += dx;
                    else if (dy !== 0 && isPassable(entity.x, entity.y + dy)) entity.y += dy;
                }
            }
        }
    }

    function gameLoop() {
        if(!isGameRunning) return; 

        heroes.forEach(h => updateEntity(h, monsters));
        monsters.forEach(m => updateEntity(m, heroes));

        heroes = heroes.filter(h => h.hp > 0);
        monsters = monsters.filter(m => m.hp > 0);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // マップ描画
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (map[y][x] === 1) {
                    ctx.fillStyle = '#95a5a6'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#7f8c8d'; ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (map[y][x] === 2) {
                    ctx.fillStyle = '#7b8d41'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#556b2f'; ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (map[y][x] === 3) {
                    ctx.fillStyle = '#795548'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#5D4037'; ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (map[y][x] === 4) {
                    ctx.fillStyle = '#87CEEB'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (map[y][x] === 5) {
                    ctx.fillStyle = '#8e44ad'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#2c3e50'; ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = 'red'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE - 6, TILE_SIZE, 4);
                    ctx.fillStyle = '#f1c40f';
                    const hpRatio = Math.max(0, castleHp) / CASTLE_MAX_HP;
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE - 6, TILE_SIZE * hpRatio, 4);
                } else if (map[y][x] === 6) {
                    ctx.fillStyle = '#9A6229'; ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#6d4219'; ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // エンティティ描画
        function drawEntity(entity) {
            const centerX = entity.x * TILE_SIZE + TILE_SIZE / 2 + entity.ox;
            const centerY = entity.y * TILE_SIZE + TILE_SIZE / 2 + entity.oy;
            const radius = entity.isHero ? 4.5 : 2.8;

            ctx.beginPath(); 
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2); 
            ctx.fillStyle = entity.color; ctx.fill();
            
            const barWidth = entity.isHero ? 12 : 10; 
            const barHeight = 2;
            const barX = centerX - barWidth / 2; 
            const barY = centerY - (entity.isHero ? 8 : 6); 

            ctx.fillStyle = 'red'; ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = '#2ecc71';
            const hpRatio = Math.max(0, entity.hp) / entity.maxHp;
            ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
        }

        monsters.forEach(drawEntity);
        heroes.forEach(drawEntity);

        // パーティクル描画
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life -= 0.04; 
            if (p.life <= 0) {
                particles.splice(i, 1);
            } else {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1.0;
            }
        }

        requestAnimationFrame(gameLoop);
    }
</script>
